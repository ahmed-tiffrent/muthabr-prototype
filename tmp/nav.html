<!-- Case study floating section navigation (TSSC, HSBC, Novacap: a Code block in the hero; Muthabr: appended to its main Code block, without the marker span). -->
<style>
  .cs-nav-host { pointer-events: none !important; }
  .cs-nav { --cs-accent: #b2b1d3; position: fixed; left: 12px; top: 50%; z-index: 10000; font-family: "Open Sans", sans-serif; transform: translateY(-50%); opacity: 0; visibility: hidden; transition: opacity .25s ease, visibility .25s; }
  .cs-nav.is-visible { opacity: 1; visibility: visible; }
  .cs-nav ol { list-style: none; margin: 0; padding: 12px 16px 12px 10px; border-radius: 14px; max-height: min(80vh, 760px); overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; transition: background-color .2s ease .12s, box-shadow .2s ease .12s; }
  .cs-nav ol::-webkit-scrollbar { display: none; }
  .cs-nav:hover ol, .cs-nav:has(a:focus-visible) ol { background: rgba(12, 12, 14, .94); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); box-shadow: 0 0 0 1px rgba(178, 177, 211, .18), 0 24px 48px -16px rgba(0, 0, 0, .7); transition-delay: 0s; }
  .cs-nav li { margin: 0; padding: 0; }
  .cs-nav a { position: relative; display: flex; align-items: center; gap: 0; min-height: 24px; padding: 3px 6px 3px 0; border-radius: 6px; color: rgba(255, 255, 255, .36); font-size: 13px; line-height: 1.3; text-decoration: none; transition: color .2s ease, gap .2s ease .12s, background-color .2s ease; }
  .cs-nav a.is-read { color: rgba(255, 255, 255, .6); }
  .cs-nav .cs-tick { flex: none; width: 24px; height: 3px; display: flex; align-items: center; }
  .cs-nav .cs-tick::before { content: ""; width: 10px; height: 2px; border-radius: 2px; background: currentColor; transition: width .2s ease, height .2s ease; }
  .cs-nav a.is-read .cs-tick::before { width: 14px; }
  .cs-nav .cs-label { max-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; transition: max-width .25s ease .12s; }
  .cs-nav:hover a, .cs-nav:has(a:focus-visible) a { gap: 12px; transition-delay: 0s; }
  .cs-nav:hover .cs-label, .cs-nav:has(a:focus-visible) .cs-label { max-width: 260px; transition-delay: 0s; }
  .cs-nav a:hover, .cs-nav a:focus-visible { color: var(--cs-accent); outline: none; }
  .cs-nav a:hover .cs-tick::before, .cs-nav a:focus-visible .cs-tick::before { width: 18px; }
  .cs-nav a:focus-visible { box-shadow: 0 0 0 2px var(--cs-accent); }
  .cs-nav a.is-active { color: var(--cs-accent); font-weight: 600; }
  .cs-nav a.is-active .cs-tick::before { width: 24px; height: 3px; }
  .cs-nav:hover a.is-active, .cs-nav:has(a:focus-visible) a.is-active { background: rgba(178, 177, 211, .12); }
  @media (min-width: 1024px) {
    .cs-nav a.is-active { gap: 12px; }
    .cs-nav a.is-active .cs-label { max-width: 260px; padding: 3px 10px; margin-left: -6px; border-radius: 999px; background: rgba(12, 12, 14, .88); box-shadow: 0 0 0 1px rgba(178, 177, 211, .25); }
    .cs-nav:hover a.is-active .cs-label, .cs-nav:has(a:focus-visible) a.is-active .cs-label { padding: 0; margin-left: 0; background: none; box-shadow: none; }
  }

  .cs-nav-toggle { display: none; }
  @media (max-width: 1023px) {
    .cs-nav { left: 16px; right: auto; top: auto; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: none; }
    .cs-nav ol { display: none; position: absolute; left: 0; bottom: 56px; width: min(320px, calc(100vw - 32px)); max-height: 62vh; padding: 10px 8px; background: rgba(12, 12, 14, .97); box-shadow: 0 0 0 1px rgba(178, 177, 211, .2), 0 24px 48px -12px rgba(0, 0, 0, .8); }
    .cs-nav.is-open ol { display: block; }
      .cs-nav a { gap: 12px; min-height: 44px; padding: 8px 10px; font-size: 15px; color: rgba(255, 255, 255, .72); }
    .cs-nav a.is-read { color: rgba(255, 255, 255, .72); }
    .cs-nav a.is-active { background: rgba(178, 177, 211, .14); }
    .cs-nav .cs-tick { display: none; }
    .cs-nav .cs-label { max-width: none; white-space: normal; }
    .cs-nav-toggle { display: inline-flex; align-items: center; gap: 10px; max-width: calc(100vw - 32px); min-height: 44px; padding: 0 16px 0 18px; border: 0; border-radius: 999px; background: var(--cs-accent); color: #0c0c0e; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; box-shadow: 0 10px 24px -8px rgba(0, 0, 0, .6); }
    .cs-nav-toggle .cs-tl { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .cs-nav-toggle .cs-tc { flex: none; font-weight: 500; font-size: 12px; opacity: .7; }
    .cs-nav-toggle svg { flex: none; transition: transform .2s ease; }
    .cs-nav.is-open .cs-nav-toggle svg { transform: rotate(180deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .cs-nav, .cs-nav * { transition: none !important; }
  }
</style>
<script>
(function () {
  if (window.__csNav) return;
  window.__csNav = true;

  function init() {
    // The Code block itself renders nothing; keep it from catching clicks on the hero.
    document.querySelectorAll('.fe-block').forEach(function (b) {
      if (b.querySelector('.cs-nav-marker')) b.classList.add('cs-nav-host');
    });

    // On phones the empty Code block still owns its own grid rows in the hero, leaving a gap
    // above the title. Hide it and pull the blocks below up by the same number of rows.
    function collapseHost() {
      var host = document.querySelector('.cs-nav-host');
      var grid = host && host.parentElement;
      if (!grid || !grid.classList.contains('fluid-engine')) return;
      grid.querySelectorAll('[data-cs-shift]').forEach(function (x) { x.style.gridRowStart = ''; x.style.gridRowEnd = ''; x.removeAttribute('data-cs-shift'); });
      host.style.display = ''; grid.style.gridTemplateRows = '';
      if (!window.matchMedia('(max-width: 767px)').matches) return;
      var hs = getComputedStyle(host), a = parseInt(hs.gridRowStart, 10), b = parseInt(hs.gridRowEnd, 10);
      if (!(a > 0 && b > a)) return;
      var rows = Array.prototype.filter.call(grid.children, function (x) { return x !== host; }).map(function (x) {
        var c = getComputedStyle(x); return [x, parseInt(c.gridRowStart, 10), parseInt(c.gridRowEnd, 10)];
      });
      // Only collapse when nothing else shares those rows.
      if (rows.some(function (r) { return !(r[1] > 0 && r[2] > 0) || (r[1] < b && r[2] > a); })) return;
      var tracks = getComputedStyle(grid).gridTemplateRows.split(' ').map(parseFloat).filter(function (v) { return !isNaN(v); });
      if (!tracks.length) return;
      var n = b - a, min = Math.min.apply(null, tracks);
      rows.forEach(function (r) {
        if (r[1] >= b) { r[0].style.gridRowStart = r[1] - n; r[0].style.gridRowEnd = r[2] - n; r[0].setAttribute('data-cs-shift', ''); }
      });
      host.style.display = 'none';
      grid.style.gridTemplateRows = 'repeat(' + (tracks.length - n) + ', minmax(' + min + 'px, auto))';
    }
    collapseHost();
    var mq = window.matchMedia('(max-width: 767px)');
    if (mq.addEventListener) mq.addEventListener('change', collapseHost); else if (mq.addListener) mq.addListener(collapseHost);

    // Case study sections: skip the hero, testimonials and contact form.
    var sections = Array.prototype.slice.call(document.querySelectorAll('#sections > section, article section[data-section-id], main section[data-section-id]'))
      .filter(function (s, i, all) { return all.indexOf(s) === i; });
    // Muthabr builds its whole case study inside one Code block: use its chapters instead.
    var chapters = Array.prototype.slice.call(document.querySelectorAll('section.mu-case-chapter'));
    var skipFirst = true;
    if (chapters.length >= 3) { sections = chapters; skipFirst = false; }
    var items = [];
    sections.forEach(function (s, i) {
      if (skipFirst && i === 0) return;
      var h = s.querySelector('.mu-case-kicker') || s.querySelector('h1, h2, h3');
      if (!h) return;
      var text = (s.getAttribute('data-nav-label') || h.textContent).trim().replace(/\.$/, '');
      if (!text || /^[“"]/.test(text) || /^contact us/i.test(text)) return;
      if (!s.id) s.id = 'cs-' + text.toLowerCase().replace(/&/g, 'and').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
      items.push({ section: s, label: text });
    });
    if (items.length < 3) return;

    var header = document.querySelector('#header, header');
    function headerOffset() { return header ? header.getBoundingClientRect().height : 0; }

    var nav = document.createElement('nav');
    nav.className = 'cs-nav';
    nav.setAttribute('aria-label', 'Case study sections');
    var toggle = document.createElement('button');
    toggle.type = 'button';
    toggle.className = 'cs-nav-toggle';
    toggle.setAttribute('aria-expanded', 'false');
    toggle.innerHTML = '<span class="cs-tl">Sections</span><span class="cs-tc"></span><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 7.5 6 4l3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    var list = document.createElement('ol');
    var tLabel = toggle.querySelector('.cs-tl'), tCount = toggle.querySelector('.cs-tc');
    var seekTimer;
    var links = items.map(function (it) {
      var li = document.createElement('li');
      var a = document.createElement('a');
      a.href = '#' + it.section.id;
      a.innerHTML = '<span class="cs-tick" aria-hidden="true"></span><span class="cs-label"></span>';
      a.querySelector('.cs-label').textContent = it.label;
      a.addEventListener('click', function (e) {
        e.preventDefault();
        // Mouse clicks shouldn't leave focus on the link, or the panel stays open until the next click.
        if (e.detail > 0) a.blur();
        var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        function aim() { window.scrollTo({ top: it.section.getBoundingClientRect().top + window.pageYOffset - headerOffset(), behavior: reduce ? 'auto' : 'smooth' }); }
        aim();
        // Lazy images load during long jumps and push the target down: re-aim once the scroll settles.
        clearInterval(seekTimer);
        var last = -1, tries = 0;
        seekTimer = setInterval(function () {
          if (Math.abs(window.pageYOffset - last) > 1) { last = window.pageYOffset; return; }
          if (Math.abs(it.section.getBoundingClientRect().top - headerOffset()) > 4 && tries++ < 4) { last = -1; aim(); }
          else clearInterval(seekTimer);
        }, 150);
        history.replaceState(null, '', '#' + it.section.id);
        setOpen(false);
      });
      li.appendChild(a);
      list.appendChild(li);
      return a;
    });
    nav.appendChild(list);
    nav.appendChild(toggle);
    document.body.appendChild(nav);

    function setOpen(open) {
      nav.classList.toggle('is-open', open);
      toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    }
    toggle.addEventListener('click', function () {
      var open = !nav.classList.contains('is-open');
      setOpen(open);
      // Bring the current section into view inside a long list.
      var cur = open && list.querySelector('a.is-active');
      if (cur) list.scrollTop = cur.offsetTop - list.clientHeight / 2;
    });
    // On desktop, keep the current section visible when the list scrolls.
    nav.addEventListener('mouseenter', function () {
      var cur = list.querySelector('a.is-active');
      if (cur && list.scrollHeight > list.clientHeight) list.scrollTop = cur.offsetTop - list.clientHeight / 2;
    });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') setOpen(false); });
    document.addEventListener('click', function (e) { if (!nav.contains(e.target)) setOpen(false); });

    // Highlight the section in view; show the nav only between the hero and the end of the case study.
    function update() {
      var mark = window.innerHeight * 0.4;
      var active = -1;
      items.forEach(function (it, i) { if (it.section.getBoundingClientRect().top <= mark) active = i; });
      var last = items[items.length - 1].section.getBoundingClientRect();
      var visible = items[0].section.getBoundingClientRect().top < window.innerHeight * 0.6 && last.bottom > window.innerHeight * 0.4;
      nav.classList.toggle('is-visible', visible);
      if (!visible) setOpen(false);
      var n = Math.max(active, 0) + 1;
      tCount.textContent = n + '/' + items.length;
      tLabel.textContent = active >= 0 ? items[active].label : 'Sections';
      toggle.setAttribute('aria-label', 'Sections: ' + tLabel.textContent + ', ' + n + ' of ' + items.length);
      links.forEach(function (a, i) {
        a.classList.toggle('is-read', i < active);
        a.classList.toggle('is-active', i === active);
        if (i === active) a.setAttribute('aria-current', 'location'); else a.removeAttribute('aria-current');
      });
    }
    var ticking = false;
    window.addEventListener('scroll', function () {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(function () { ticking = false; update(); });
    }, { passive: true });
    window.addEventListener('resize', update);
    update();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
<span class="cs-nav-marker" hidden></span>
