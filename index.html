<meta charset="utf-8">
<title>Muthabr Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap">
<style>
/* Layout: a single 375×812 Muthabr phone, centred on a quiet stage with a flow index beside it on desktop; full-bleed on phones. */
:root{
  --primary:#532EC9; --primary-800:#2D0D94; --purple-400:#8060E5; --purple-100:#EFEAFF; --purple-50:#F6F3FF;
  --on1:#333333; --on2:#666666; --on4:#959595; --dis:#A2A2A2;
  --outline:#EBEBEB; --surf:#FFFFFF; --surf-low:#F9F9F9; --surf-high:#E4E4E4;
  --green-500:#82B536; --green-600:#6A9A23; --green-100:#EFFFD6; --green-200:#D3F1A7; --green-900:#37471F;
  --red-500:#F15B50; --red-600:#E2483D; --red-100:#FFECEB; --red-200:#FFD5D2; --red-900:#5D1F1A;
  --yellow:#FBC02D; --warn:#F5CD47; --yellow-100:#FFF7D9; --orange:#F57C1F;
  --font:"Rubik", system-ui, -apple-system, "Segoe UI", sans-serif;
  /* stage (outside the phone) */
  --stage:#EEEBF6; --stage-ink:#2A2440; --stage-ink2:#6A6385; --stage-card:#FFFFFF; --stage-line:#DDD7EC;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--stage:#14111F;--stage-ink:#EDEAF7;--stage-ink2:#A39CBD;--stage-card:#1E1A2E;--stage-line:#2E2945;color-scheme:dark}}
:root[data-theme="dark"]{--stage:#14111F;--stage-ink:#EDEAF7;--stage-ink2:#A39CBD;--stage-card:#1E1A2E;--stage-line:#2E2945;color-scheme:dark}

html,body{height:100%;margin:0}
body{background:var(--stage);color:var(--stage-ink);font-family:var(--font);overflow:hidden;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--purple-400);outline-offset:2px}

/* ---------- stage ---------- */
.stage{height:100%;display:flex;align-items:center;justify-content:center}
.side{width:260px;display:flex;flex-direction:column;gap:20px}
.side h1{font-size:28px;font-weight:600;line-height:34px;margin:0;letter-spacing:-.01em;text-wrap:balance}
.side p{margin:0;color:var(--stage-ink2);font-size:14px;line-height:21px}
.eyebrow{font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--purple-400)}
.flows{display:flex;flex-direction:column;border:1px solid var(--stage-line);border-radius:14px;background:var(--stage-card);overflow:hidden}
.flows button{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 14px;font-size:14px;text-align:left;border-top:1px solid var(--stage-line)}
.flows button:first-child{border-top:0}
.flows button:hover{background:color-mix(in srgb,var(--purple-400) 10%,transparent)}
.flows button span:last-child{color:var(--stage-ink2);font-size:12px}
.hint{font-size:12px;color:var(--stage-ink2);line-height:18px}
.device{position:relative;width:375px;height:812px;flex:none;transform-origin:center center}
.bezel{position:absolute;inset:-12px;border-radius:58px;background:#0E0B16;box-shadow:0 40px 80px -20px rgba(40,20,90,.45),0 0 0 1.5px #3a3550 inset}
.screen-wrap{position:absolute;inset:0;border-radius:46px;overflow:hidden;background:#fff;isolation:isolate}
@media (max-width:760px){.side{display:none}}
@media (max-width:480px){
  body{padding:0}
  .stage{display:block}
  .device{width:100%;height:100%;transform:none!important}
  .bezel{display:none}
  .screen-wrap{border-radius:0}
}

/* ---------- app shell ---------- */
.app{position:absolute;inset:0;font-family:var(--font);color:var(--on1);font-size:14px;line-height:20px;-webkit-font-smoothing:antialiased;user-select:none;-webkit-tap-highlight-color:transparent}
.scr{position:absolute;inset:0;overflow:hidden;background:var(--primary);display:flex;flex-direction:column;will-change:transform}
.scr.white{background:#fff}
.anim-in-right{animation:inR .42s cubic-bezier(.22,.8,.24,1) both}
.anim-out-left{animation:outL .42s cubic-bezier(.22,.8,.24,1) both}
.anim-in-left{animation:inL .42s cubic-bezier(.22,.8,.24,1) both}
.anim-out-right{animation:outR .42s cubic-bezier(.22,.8,.24,1) both;z-index:5}
.anim-fade-in{animation:fadeIn .32s ease both}
.anim-up{animation:upIn .46s cubic-bezier(.22,.8,.24,1) both}
@keyframes inR{from{transform:translateX(100%)}to{transform:none}}
@keyframes outL{to{transform:translateX(-28%);filter:brightness(.92)}}
@keyframes inL{from{transform:translateX(-28%);filter:brightness(.92)}to{transform:none}}
@keyframes outR{to{transform:translateX(100%)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes upIn{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

.ic{width:24px;height:24px;flex:none;display:inline-block;vertical-align:middle}
.ic.s20{width:20px;height:20px}.ic.s16{width:16px;height:16px}.ic.s32{width:32px;height:32px}

/* status bar */
.status{height:54px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 30px 0 50px;font-weight:600;font-size:17px;color:#fff;position:relative;z-index:3;font-family:-apple-system,"SF Pro Text",var(--font)}
.status.dark{color:#000}
.status .lv{display:flex;gap:6px;align-items:center}
.home-ind{height:34px;flex:none;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px}
.home-ind i{width:139px;height:5px;border-radius:100px;background:var(--on1)}
.home-ind.light i{background:#fff}

/* nav bars */
.nav{height:64px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:relative}
.nav .t{position:absolute;left:64px;right:64px;text-align:center;font-weight:500;font-size:16px;line-height:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav .t small{display:flex;align-items:center;justify-content:center;gap:8px;font-size:12px;font-weight:400;line-height:16px;color:var(--on1)}
.nav .t small i{width:8px;height:8px;border-radius:50%}
.nav.on-purple{color:#fff}
.icbtn{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none;transition:background .15s}
.icbtn:active{background:rgba(0,0,0,.06)}
.icbtn.bordered{border:1px solid var(--outline)}
.sheet{flex:1;min-height:0;background:#fff;border-radius:18px 18px 0 0;display:flex;flex-direction:column;overflow:hidden;position:relative}
.sheet>.nav{border-bottom:1px solid var(--outline)}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}

/* type */
.h28{font-size:28px;line-height:36px;font-weight:600}
.t20{font-size:20px;line-height:26px;font-weight:500}
.t16{font-size:16px;line-height:22px;font-weight:500}
.l14{font-size:14px;line-height:20px;font-weight:500}
.b14{font-size:14px;line-height:20px}
.b12{font-size:12px;line-height:16px}
.l12{font-size:12px;line-height:16px;font-weight:500}
.mut{color:var(--on2)}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;padding:24px 16px 16px}
.count{font-size:12px;font-weight:500;color:var(--on2)}.count b{color:var(--primary);font-weight:500}

/* buttons */
.btn{height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:500;font-size:14px;width:100%;transition:transform .12s,box-shadow .12s,background .2s,color .2s;position:relative}
.btn.primary{background:var(--primary);color:#fff;box-shadow:0 4px 0 var(--primary-800)}
.btn.secondary{background:var(--surf-low);color:var(--on1);border:1px solid var(--outline);box-shadow:0 4px 0 var(--surf-high)}
.btn.white{background:#fff;color:var(--on1);box-shadow:0 4px 0 var(--surf-high)}
.btn.yellow{background:var(--yellow);color:var(--primary-800);box-shadow:none}
.btn.disabled{background:var(--surf-low);color:var(--dis);box-shadow:0 4px 0 var(--surf-high);pointer-events:none}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--primary-800)}
.btn.secondary:active,.btn.white:active{box-shadow:0 1px 0 var(--surf-high)}
.btn.sq{width:48px;flex:none}
.link{color:var(--primary);font-weight:500}

/* inputs */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:500;line-height:16px}
.inp{height:40px;border:1px solid var(--outline);border-radius:8px;display:flex;align-items:center;padding:0 12px 0 16px;gap:8px;background:#fff;transition:border-color .15s}
.inp:focus-within{border-color:var(--primary)}
.inp.err{border-color:var(--red-500);background:var(--red-100)}
.inp input{flex:1;border:0;outline:0;font:inherit;font-size:14px;color:var(--on1);background:transparent;min-width:0}
.inp input::placeholder{color:var(--on2)}
.errmsg{font-size:12px;color:var(--red-600)}
.search{height:40px;border:1px solid var(--outline);border-radius:10px;display:flex;align-items:center;gap:12px;padding:0 16px;background:#fff}
.search input{flex:1;border:0;outline:0;font:inherit;font-size:14px;background:transparent;min-width:0;color:var(--on1)}
.search input::placeholder{color:var(--on2)}

/* lists */
.group{border:1px solid var(--outline);border-radius:12px;overflow:hidden;background:#fff}
.row{display:flex;align-items:center;gap:12px;min-height:48px;padding:12px 16px;border-top:1px solid var(--outline);width:100%;text-align:left;transition:background .15s}
.row:first-child{border-top:0}
.row:active{background:var(--surf-low)}
.row .grow{flex:1;min-width:0}
.check{width:20px;height:20px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center}
.check.done{background:var(--green-500);color:#fff}
.check.todo{border:1.5px solid var(--outline)}
.ring{width:20px;height:20px;flex:none}
.progress{height:6px;border-radius:6px;background:var(--green-200);overflow:hidden}
.progress i{display:block;height:100%;border-radius:6px;background:var(--green-500);transition:width .8s cubic-bezier(.22,.8,.24,1)}

/* badges / chips */
.badge{min-width:16px;height:16px;padding:0 4px;border-radius:100px;font-size:10px;line-height:16px;font-weight:500;text-align:center;display:inline-block}
.seg{display:inline-flex;padding:4px;border-radius:10px;background:var(--surf-low);border:1px solid var(--outline);position:relative}
.seg button{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:6px;font-weight:500;color:var(--on2);position:relative;z-index:1;transition:color .2s}
.seg button.on{color:#fff}
.seg button .badge{background:var(--on2);color:#fff;transition:all .2s}
.seg button.on .badge{background:#fff;color:var(--primary)}
.seg .pill{position:absolute;top:4px;bottom:4px;border-radius:6px;background:var(--primary);transition:left .3s cubic-bezier(.22,.8,.24,1),width .3s cubic-bezier(.22,.8,.24,1)}

/* overlays */
.overlay{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;justify-content:flex-end}
.overlay .dim{position:absolute;inset:0;background:rgba(51,51,51,.4);animation:fadeIn .25s ease both}
.overlay.closing .dim{animation:fadeOut .22s ease both}
.overlay .bs{position:relative;background:#fff;border-radius:18px 18px 0 0;animation:sheetUp .38s cubic-bezier(.22,.8,.24,1) both}
.overlay.closing .bs{animation:sheetDown .26s ease-in both}
.overlay.center{justify-content:center;padding:0 16px}
.overlay.center .bs{border-radius:18px;animation:popIn .3s cubic-bezier(.22,.8,.24,1.2) both}
.overlay.closing.center .bs{animation:fadeOut .18s ease both}
@keyframes fadeOut{to{opacity:0}}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes sheetDown{to{transform:translateY(100%)}}
@keyframes popIn{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
.bs-head{display:flex;align-items:center;justify-content:center;position:relative;min-height:64px;border-bottom:1px solid var(--outline);padding:0 56px;text-align:center}
.bs-head .x{position:absolute;right:16px;top:12px}
.toast{position:absolute;left:16px;right:16px;bottom:110px;z-index:60;background:var(--on1);color:#fff;border-radius:12px;padding:12px 16px;display:flex;gap:10px;align-items:center;font-size:14px;animation:upIn .3s ease both}

/* ---------- screens ---------- */
/* splash */
.splash{}
.rings{position:absolute;left:50%;top:50%;width:0;height:0}
.rings i{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.06) 0,rgba(255,255,255,.02) 60%,transparent 70%);transform:translate(-50%,-50%);animation:breathe 3s ease-in-out infinite}
@keyframes breathe{50%{transform:translate(-50%,-50%) scale(1.06)}}
.splash .logo{width:74px;height:60px;position:relative;animation:logoIn .9s cubic-bezier(.22,.8,.24,1.2) both .15s}
@keyframes logoIn{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}

/* onboarding — Figma "Onboarding - 8, 9, 10, 11" */
.onb .track{flex:1;min-height:0;display:flex;transition:transform .55s cubic-bezier(.22,.8,.24,1);touch-action:pan-y}
.ob{width:375px;flex:none;display:flex;flex-direction:column;height:100%;position:relative}
.ob-sheet{flex:1;min-height:0;background:#fff;border-radius:24px 24px 0 0;display:flex;flex-direction:column}
.ob .home-ind.w{background:#fff}
.ob-head{height:69px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:16px;border-bottom:1px solid var(--outline)}
.ob-head .skip{font-size:16px;line-height:22px;font-weight:500;color:var(--on2);padding:6px 0 6px 12px}
.ob-head .bk{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:10px}
.ob-head .bk:active{background:var(--surf-low)}
.ob-body{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;padding:40px 24px 24px}
.ob-act{display:flex;flex-direction:column;gap:12px;align-items:center;padding:0 24px;flex:none}
.ob-dots{display:flex;gap:6px;height:6px}
.ob-dots i{width:6px;height:6px;border-radius:3px;background:#D8D8D8}
.ob-dots i.on{width:24px;background:var(--primary)}
.ob.active .ob-dots i.on{animation:dotGrow .45s cubic-bezier(.22,.8,.24,1) both}
@keyframes dotGrow{from{width:6px}to{width:24px}}
.obtn{height:48px;width:100%;flex:none;border-radius:12px;background:var(--primary);color:#fff;font-weight:500;font-size:14px;line-height:20px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25);padding-bottom:4px;transition:transform .12s,box-shadow .12s,padding .12s}
.obtn:active{transform:translateY(2px);box-shadow:inset 0 -1px 0 rgba(0,0,0,.25);padding-bottom:1px}
.obtn.light{background:#fff;color:var(--on1)}
.ob h2{margin:0;font-size:28px;line-height:36px;font-weight:600;color:var(--on1);width:100%}
.ob .desc{margin:16px 0 0;font-size:14px;line-height:20px;color:var(--on2);width:100%}
.ob .rise{opacity:0;transform:translateY(14px)}
.ob.active .rise{animation:upIn .55s cubic-bezier(.22,.8,.24,1) both}
/* 8 — social proof */
.ob-num{font-size:48px;line-height:60px;font-weight:600;color:var(--primary);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.deck{position:relative;width:311px;height:254px;flex:none;cursor:grab;touch-action:pan-y}
.tc{position:absolute;border-radius:18px;border:1px solid transparent;overflow:hidden;transition:left .6s cubic-bezier(.22,.8,.24,1),top .6s cubic-bezier(.22,.8,.24,1),width .6s cubic-bezier(.22,.8,.24,1),height .6s cubic-bezier(.22,.8,.24,1),opacity .5s,transform .45s cubic-bezier(.5,0,.75,0)}
.tc .in{position:absolute;left:0;top:0;width:311px;height:234px;transition:opacity .3s}
.tc.p0 .in{transition-delay:.25s}
.tc:not(.p0) .in{opacity:0}
.tc.p0{left:0;top:0;width:311px;height:234px;z-index:3}
.tc.p1{left:20px;top:144px;width:271px;height:100px;z-index:2;border-radius:16px;border-color:transparent!important}
.tc.p2{left:40px;top:154px;width:233px;height:100px;z-index:1;border-radius:16px;border-color:transparent!important}
.tc.y{background:#FFEDC2;border-color:#FFE199;box-shadow:0 6px 16px rgba(255,225,153,.1)}
.tc.y.p1,.tc.y.p2{background:rgba(255,237,194,.6)}
.tc.pk{background:#FFE5E4;border-color:#FFD2D0}
.tc.pk.p1{background:rgba(255,218,217,.64)}.tc.pk.p2{background:rgba(255,218,217,.4)}
.tc.bl{background:#E4F3FF;border-color:#CBE7FF}
.tc.bl.p1{background:rgba(213,238,255,.64)}.tc.bl.p2{background:rgba(213,238,255,.4)}
.tc.out{transform:translate(-130%,-10px) rotate(-10deg);opacity:0}
.tc .av{position:absolute;left:20px;top:20px;width:40px;height:40px;border-radius:50%;object-fit:cover}
.tc .q{position:absolute;left:19px;top:74px;width:271px;font-size:14px;line-height:20px;color:var(--on1);margin:0}
.tc .who{position:absolute;left:19px;top:181px}
.tc .who b{display:block;font-size:12px;line-height:16px;font-weight:500;color:var(--on1)}
.tc .who span{display:block;margin-top:4px;font-size:10px;line-height:12px;font-weight:500;color:var(--on2)}
.tc .qm{position:absolute;right:20px;top:24px;width:29px;height:20px}
.ag{display:flex}
.ag span{width:20px;height:20px;border-radius:50%;border:1px solid #fff;overflow:hidden;margin-right:-4px;display:flex;align-items:flex-start;justify-content:center}
.ag span:last-child{margin-right:0}
.ag img{width:88%;height:auto;margin-top:-1px}
/* 9 — matching widget */
.stack9{position:relative;width:343px;height:370px;flex:none;margin:0 -8px}
.stack9 .bc{position:absolute;height:100px;border-radius:16px;background:var(--surf-low);border:1px solid var(--outline)}
.mcard{position:absolute;left:0;top:0;width:343px;height:346px;background:#fff;border:1px solid var(--outline);border-radius:18px;box-shadow:0 6px 20px rgba(83,46,201,.1);overflow:hidden;padding:24px}
.mcard .t20{margin-bottom:24px}
.mopts{position:relative;width:295px;display:flex;flex-direction:column;gap:12px}
.mrow{display:flex;gap:40px;position:relative;z-index:1}
.mi{width:127.5px;height:40px;box-sizing:border-box;border:1px solid var(--outline);background:#fff;border-radius:8px;padding:0 16px;display:flex;align-items:center;font-size:12px;line-height:16px;font-weight:500;color:var(--on1);position:relative;text-align:left;transition:background .2s,border-color .2s,color .2s}
.mi.on{background:var(--purple-100);border:2px solid #643FDA;color:#1A006E;padding:0 15px}
.mi .dot{position:absolute;top:50%;width:16px;height:16px;margin-top:-8px;border-radius:50%;background:#fff;border:1px solid var(--outline);transition:border .2s}
.mi.L .dot{right:-8.5px}.mi.R .dot{left:-8.5px}
.mi.on .dot{border:6px solid var(--primary);right:-9.5px}.mi.R.on .dot{left:-9.5px;right:auto}
.mi.act .dot{border:2px solid var(--primary)}
.mi.act{border-color:var(--primary)}
.mi.L.on.act{background:var(--purple-100)}
.mlines{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:visible}
.mlines line{stroke:var(--primary);stroke-width:2;stroke-linecap:round}
.mlines line.draw{animation:lineDraw .45s cubic-bezier(.22,.8,.24,1) both}
@keyframes lineDraw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
.mcap{position:absolute;left:0;right:0;bottom:0;padding:24px;text-align:center;font-size:14px;line-height:20px;color:var(--on2);background:linear-gradient(to bottom,rgba(255,255,255,0),#fff 50%);transition:color .3s}
.mcap.ok{color:var(--green-600);font-weight:500}
/* 10 — study path */
.path10{position:relative;width:280px;height:304px;flex:none}
.pc{position:absolute;left:0;width:280px;height:64px;border-radius:16px;background:#fff;border:1px solid var(--outline);display:flex;align-items:center;gap:12px;padding:0 12px;text-align:left;transition:border-color .3s,box-shadow .3s}
.pc img{width:40px;height:40px;flex:none}
.pc b{display:block;font-size:16px;line-height:22px;font-weight:500;color:var(--on1)}
.pc span{display:block;margin-top:2px;font-size:12px;line-height:16px;color:var(--on2)}
.pc.hl{border:2px solid #EA7920;padding:0 11px;box-shadow:0 6px 16px rgba(83,46,201,.1)}
.pc.hl img{transform:scale(1.06)}
.pc img{transition:transform .3s cubic-bezier(.22,.8,.24,1.4)}
.plink{position:absolute;left:139px;width:2px;height:16px;border-radius:1px;background:var(--surf-high);overflow:hidden}
.plink i{position:absolute;inset:0;background:#EA7920;transform:scaleY(0);transform-origin:top;transition:transform .3s}
.plink.f i{transform:scaleY(1)}
.ob .pop{opacity:0;transform:translateY(10px) scale(.98)}

.pstats{display:flex;justify-content:space-between;padding:0 24px;margin-top:24px}
.pstats>div{display:flex;flex-direction:column;align-items:center;gap:6px}
.ovw{margin:24px 16px 0;background:var(--purple-100);border-radius:16px;padding:12px 8px 8px}
.ovw .tiles{display:flex;gap:6px;margin-top:12px}
.ovw .tiles>div{flex:1;background:#fff;border-radius:10px;height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}

.srch input{flex:1;border:0;outline:0;font:inherit;font-size:14px;color:var(--on1);background:transparent;min-width:0}

.awards .three{display:flex;gap:8px;width:100%}
.awards .three>div{flex:1;background:#fff;border-radius:10px;padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}

.tag.fr{background:var(--red-100);border-color:var(--red-200);color:var(--red-600)}.tag.fr .badge{background:var(--red-500)}

.bgroup{border:1px solid var(--outline);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;position:relative}

/* ---------------- router ---------------- */
let stack = [];   // [{name, params, el}]
const R = {};     // render functions
function render(name, params){ const el=document.createElement('div'); el.className='scr'; el.dataset.name=name; R[name](el, params||{}); return el; }
function go(name, params, mode='push'){
  closeOverlay(true);
  const el = render(name, params);
  const prev = stack[stack.length-1];
  if(mode==='push' && prev){
    el.classList.add('anim-in-right'); prev.el.classList.add('anim-out-left');
    $app.appendChild(el);
    const p=prev; setTimeout(()=>{p.el.remove(); p.el.classList.remove('anim-out-left');}, 430);
    stack.push({name, params, el});
  } else {
    // replace whole stack (fade / root)
    el.classList.add(mode==='up' ? 'anim-up' : 'anim-fade-in');
    $app.appendChild(el);
    stack.forEach(s=>{ const old=s.el; setTimeout(()=>old.remove(), 340); });
    stack=[{name, params, el}];
  }
  el.addEventListener('animationend', ()=>el.classList.remove('anim-in-right','anim-up','anim-fade-in'), {once:true});
}
function back(){
  closeOverlay(true);
  if(stack.length<2) return;
  const cur = stack.pop(); const prev = stack[stack.length-1];
  prev.el = render(prev.name, prev.params);
  prev.el.classList.add('anim-in-left'); cur.el.classList.add('anim-out-right');
  $app.insertBefore(prev.el, cur.el);
  setTimeout(()=>{cur.el.remove(); prev.el.classList.remove('anim-in-left');}, 430);
}
function rerender(){ const top=stack[stack.length-1]; if(!top) return; const sc = top.el.querySelector('.scroll'); const y = sc?sc.scrollTop:0; const el=render(top.name, top.params); $app.replaceChild(el, top.el); top.el=el; const sc2=el.querySelector('.scroll'); if(sc2) sc2.scrollTop=y; }
function bind(el, sel, fn){ el.querySelectorAll(sel).forEach(n=>n.addEventListener('click', e=>{e.stopPropagation(); fn(n, e);})); }

/* overlays */
let ov=null;
function overlay(html, {center=false, onClose}={}){
  closeOverlay(true);
  ov=document.createElement('div'); ov.className='overlay'+(center?' center':'');
  ov.innerHTML=`<div class="dim"></div><div class="bs">${html}</div>`;
  ov.querySelector('.dim').addEventListener('click', ()=>closeOverlay());
  ov._onClose=onClose;
  $app.appendChild(ov); return ov.querySelector('.bs');
}
function closeOverlay(instant){
  if(!ov) return; const o=ov; ov=null;
  if(instant){o.remove(); return;}
  o.classList.add('closing'); setTimeout(()=>o.remove(), 260);
}
function toast(msg, icon='check-circle'){
  const t=document.createElement('div'); t.className='toast'; t.innerHTML=`${ic('f-'+icon,'s20',icon==='check-circle'?'#82B536':'')}<span>${msg}</span>`;

}
function confetti(n=70){
  const c=document.createElement('div'); c.className='confetti';
  const cols=['#532EC9','#8060E5','#FBC02D','#82B536','#F15B50','#EFEAFF'];

}

  el.querySelectorAll('.s8 .home-ind,.s9 .home-ind,.s10 .home-ind').forEach(h=>h.classList.add('w'));
  const track=el.querySelector('.track'), slides=[...el.querySelectorAll('.ob')];
  const timers=[]; const later=(fn,ms)=>{ const t=setTimeout(()=>{ if(el.isConnected) fn(); },ms); timers.push(t); return t; };
  const clearT=()=>{ while(timers.length) clearTimeout(timers.pop()); };

  /* 8 · count-up + testimonial deck */
  const countUp=()=>{ const n=el.querySelector('[data-count]'); const t0=performance.now(); const f=t=>{ if(!el.isConnected) return; const p=Math.min(1,(t-t0)/1300); n.textContent=Math.round(110000*(1-Math.pow(1-p,3))).toLocaleString('en-US')+'+'; if(p<1) requestAnimationFrame(f);}; requestAnimationFrame(f); };
  let order=[0,1,2], deckT=null, deckBusy=false;
  const cards=[...el.querySelectorAll('.tc')];
  const layDeck=()=>order.forEach((k,pos)=>{ const c=cards[k]; c.classList.remove('p0','p1','p2'); c.classList.add('p'+pos); });
  const nextCard=()=>{ if(deckBusy) return; deckBusy=true; const front=cards[order[0]]; front.classList.add('out');
    setTimeout(()=>{ order=[order[1],order[2],order[0]]; front.style.transition='none'; front.classList.remove('out'); layDeck(); front.offsetWidth; front.style.transition=''; deckBusy=false; }, 380);
  };
  const startDeck=()=>{ clearInterval(deckT); deckT=setInterval(()=>{ if(!el.isConnected){clearInterval(deckT);return;} if(i===0) nextCard(); }, 3400); };
  const deck=el.querySelector('[data-deck]'); let dx0=null;
  deck.addEventListener('pointerdown',e=>{dx0=e.clientX; e.stopPropagation();});
  deck.addEventListener('pointerup',e=>{ e.stopPropagation(); if(dx0===null) return; const d=e.clientX-dx0; dx0=null; if(Math.abs(d)<8||d<-30){ nextCard(); startDeck(); } });

  /* 9 · matching widget — tap or drag from a left answer to a right answer */
  const mopts=el.querySelector('[data-mopts]'), svg=el.querySelector('[data-lines]'), cap=el.querySelector('[data-mcap]');
  const Ls=[...el.querySelectorAll('.mi.L')], Rs=[...el.querySelectorAll('.mi.R')];
  let links={}, active=null, dragLine=null, ghost=null;
  const yOf=k=>k*52+20, XL=127, XR=168;
  const lineSVG=(a,b,draw,x2,y2)=>{ const X2=x2??XR, Y2=y2??yOf(b); const len=Math.hypot(X2-XL,Y2-yOf(a)).toFixed(1); return `<line x1="${XL}" y1="${yOf(a)}" x2="${X2}" y2="${Y2}" ${draw?`class="draw" style="--len:${len};stroke-dasharray:${len}"`:''}/>`; };
  const drawM=(fresh)=>{
    svg.innerHTML = Object.entries(links).map(([a,b])=>lineSVG(+a,b,+a===fresh)).join('') + (ghost?lineSVG(ghost.a,0,false,ghost.x,ghost.y):'');
    Ls.forEach((n,k)=>{ n.classList.toggle('on', k in links); n.classList.toggle('act', active===k); });
    const used=Object.values(links); Rs.forEach((n,k)=>n.classList.toggle('on', used.includes(k)));
    const all=Object.keys(links).length===4; cap.classList.toggle('ok',all); cap.textContent= all?'All matched. Nice work!':'Match answers with a line';
  };
  const link=(a,b)=>{ for(const k in links) if(links[k]===b) delete links[k]; links[a]=b; active=null; ghost=null; drawM(a); };
  const demo=()=>{ links={}; active=null; ghost=null; drawM();
    later(()=>link(1,2),450); later(()=>link(2,1),850); later(()=>link(3,0),1250);
    later(()=>{ active=0; ghost={a:0,x:142,y:65.5}; drawM(); },1700); };
  const scaleOf=()=>mopts.getBoundingClientRect().width/295;
  const local=e=>{ const r=mopts.getBoundingClientRect(), s=scaleOf(); return {x:(e.clientX-r.left)/s, y:(e.clientY-r.top)/s}; };
  Ls.forEach((n,k)=>n.addEventListener('pointerdown',e=>{ e.stopPropagation(); clearT(); if(k in links) delete links[k]; active=k; ghost=null; drawM(); dragLine={a:k,moved:false}; n.setPointerCapture?.(e.pointerId); }));
  Ls.forEach(n=>n.addEventListener('pointermove',e=>{ if(!dragLine) return; const p=local(e); dragLine.moved=true; ghost={a:dragLine.a,x:p.x,y:p.y}; drawM(); }));
  Ls.forEach(n=>n.addEventListener('pointerup',e=>{ e.stopPropagation(); if(!dragLine) return; const d=dragLine; dragLine=null; if(!d.moved){ ghost=null; drawM(); return; }
    const p=local(e); const k=Math.round((p.y-20)/52); if(p.x>150 && k>=0 && k<4) link(d.a,k); else { ghost=null; drawM(); } }));
  Rs.forEach((n,k)=>n.addEventListener('pointerup',e=>e.stopPropagation()));
  Rs.forEach((n,k)=>n.addEventListener('click',e=>{ e.stopPropagation(); clearT(); if(active!==null) link(active,k); else { const a=Object.keys(links).find(x=>links[x]===k); if(a!==undefined){ delete links[a]; active=+a; drawM(); } } }));
  [...Ls,...Rs].forEach(n=>n.addEventListener('pointerdown',e=>e.stopPropagation()));

  /* 10 · the highlight walks the study path, then rests on Exams */
  const pcs=[...el.querySelectorAll('.pc')], plinks=[...el.querySelectorAll('.plink')];
  const hl=(k)=>{ pcs.forEach((c,j)=>c.classList.toggle('hl',j===k)); plinks.forEach((l,j)=>l.classList.toggle('f', j<k && j===k-1)); };
  const walk=()=>{ hl(-1); [0,1,2,3].forEach(k=>later(()=>hl(k), 550+k*420)); later(()=>plinks.forEach(l=>l.classList.remove('f')), 550+3*420+500); };
  pcs.forEach((c,k)=>c.addEventListener('click',()=>{ clearT(); hl(k); later(()=>plinks.forEach(l=>l.classList.remove('f')),500); }));

  /* 11 · score ring fills to 100% */
  const ring=el.querySelector('[data-ring]'), pct=el.querySelector('[data-pct]');
  const fill=()=>{ ring.style.transition='none'; ring.style.strokeDashoffset=515.2; pct.textContent='0%'; ring.getBoundingClientRect();
    later(()=>{ ring.style.transition='stroke-dashoffset 1.1s cubic-bezier(.4,0,.2,1)'; ring.style.strokeDashoffset=0; const t0=performance.now(); const f=t=>{ if(!el.isConnected) return; const p=Math.min(1,(t-t0)/1100); pct.textContent=Math.round(100*(p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2))+'%'; if(p<1) requestAnimationFrame(f);}; requestAnimationFrame(f); }, 350); };

  const set=(n)=>{
    n=Math.max(0,Math.min(3,n)); const changed=n!==i||!set.done; i=n; set.done=true;
    track.style.transform=`translateX(${-375*i}px)`;
    if(!changed) return;
    clearT();
    slides.forEach((s,k)=>{ s.classList.remove('active'); if(k===i){ s.offsetWidth; s.classList.add('active'); } });
    if(i===0) countUp();
    if(i===1) demo();
    if(i===2) walk();
    if(i===3) fill();
  };
  set(0); startDeck();
  bind(el,'[data-next]',()=>set(i+1));
  bind(el,'[data-prev]',()=>set(i-1));
  bind(el,'[data-skip]',()=>set(3));
  bind(el,'[data-start]',()=>go('signup',{},'fade'));
  bind(el,'[data-have]',()=>go('signin',{},'fade'));
  let sx=null; track.addEventListener('pointerdown',e=>{sx=e.clientX;});
  track.addEventListener('pointerup',e=>{ if(sx===null) return; const dx=e.clientX-sx; sx=null; if(dx<-50) set(i+1); else if(dx>50) set(i-1); });
};

  const showTimer=()=>{ if(left>0){ timer.innerHTML=`Time remaining to resend code: <span style="color:var(--red-500)">${String(Math.floor(left/60)).padStart(2,'0')}:${String(left%60).padStart(2,'0')}</span>`; } else { timer.innerHTML=`<button class="link" data-resend>Resend code</button>`; bind(timer,'[data-resend]',resend); } };
  const startTimer=()=>{ clearInterval(tick); left=120; showTimer(); tick=setInterval(()=>{ if(!el.isConnected){clearInterval(tick);return;} left--; showTimer(); if(left<=0) clearInterval(tick); },1000); };
  const sms=()=>{ el.querySelector('.sms')?.remove(); const n=document.createElement('button'); n.className='sms'; n.innerHTML=`<span class="ap">${ic('r-chat-circle','s20','#fff')}</span><span style="flex:1;min-width:0"><b>Muthabr</b><p>Your Muthabr verification code is ${CODE.slice(0,3)} ${CODE.slice(3)}. Tap to fill in.</p></span><small>now</small>`;
    n.addEventListener('click',()=>{ inp.value=CODE; inp.dispatchEvent(new Event('input')); n.classList.add('bye'); setTimeout(()=>n.remove(),300); });
    el.appendChild(n); setTimeout(()=>{ if(n.isConnected){ n.classList.add('bye'); setTimeout(()=>n.remove(),300);} }, 12000); };
  const clearErr=()=>{ otp.classList.remove('bad'); el.querySelector('.ctoast')?.remove(); };
  const resend=()=>{ clearErr(); inp.value=''; paint(); startTimer(); setTimeout(sms,900); inp.focus({preventScroll:true}); };
  const verify=()=>{
    const v=inp.value;
    if(v.length<6){ otp.classList.remove('shake'); otp.offsetWidth; otp.classList.add('shake'); inp.focus({preventScroll:true}); return; }
    if(v!==CODE){
      otp.classList.add('bad'); otp.classList.remove('shake'); otp.offsetWidth; otp.classList.add('shake');
      clearInterval(tick); left=0; showTimer();
      el.querySelector('.ctoast')?.remove(); const t=document.createElement('div'); t.className='ctoast'; t.innerHTML=`<span>Not a valid code, try again or resend it</span><button class="icbtn" style="width:32px;height:32px" aria-label="Dismiss">${ic('r-x','s20')}</button>`;
      t.querySelector('button').addEventListener('click',()=>t.remove()); el.appendChild(t); return;
    }
    otp.classList.add('good'); clearInterval(tick); setTimeout(()=>go('users',{},'push'), 550);
  };
  inp.addEventListener('input',()=>{ inp.value=inp.value.replace(/\D/g,'').slice(0,6); if(otp.classList.contains('bad')) clearErr(); paint(); if(inp.value.length===6) setTimeout(verify,250); });
  inp.addEventListener('focus',paint); inp.addEventListener('blur',paint);
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter') verify(); });
  bind(el,'[data-verify]',verify);
  bind(el,'[data-change]',()=>back());
  startTimer(); paint();
  setTimeout(()=>{ if(el.isConnected){ inp.focus({preventScroll:true}); paint(); } }, 450);
  setTimeout(()=>{ if(el.isConnected) sms(); }, 1400);
};

R.flash = (el) => {
  const F=S.flash;
  if(F.i>=CARDS.length){ return R.flashDone(el); }
  const c=CARDS[F.i];
  el.innerHTML = `${statusBar()}${navBar({title:F.title, left:'x', right:'dots-three', onPurple:true})}
   <div class="fc-area"><div class="fc-stack b"></div><div class="fc-stack"></div>
     <div class="fc" data-card tabindex="0" aria-label="Flashcard. Tap to flip">
       <div class="face"><div style="display:flex;justify-content:space-between" class="b14 mut"><span>${ic('r-text-aa','s20')}</span><span>${F.i+1} of ${CARDS.length}</span></div><div class="mid">${esc(c.q)}</div><div class="b14 mut" style="text-align:center">Tap to Reveal Answer</div></div>
       <div class="face back"><div style="display:flex;justify-content:space-between" class="b14 mut"><span>${ic('r-text-aa','s20')}</span><span>${F.i+1} of ${CARDS.length}</span></div><div class="mid">${esc(c.a)}</div><div class="b14 mut" style="text-align:center">Tap to Reveal Question</div></div>
       <span class="fc-stamp" data-yes style="left:24px;color:#6A9A23;border-color:#82B536;background:#EFFFD6;transform:rotate(-8deg)">I know it</span>
       <span class="fc-stamp" data-no style="right:24px;color:#E2483D;border-color:#F15B50;background:#FFECEB;transform:rotate(8deg)">Still learning</span>
     </div></div>
   <div class="fc-bar"><button class="btn secondary sq" data-no-b aria-label="I don't know">${ic('r-x','s20')}</button><div class="b12 mut" style="flex:1;text-align:center">Swipe to right if you know the answer, or left if you don’t</div><button class="btn primary sq" data-yes-b aria-label="I know it">${ic('r-check','s20')}</button></div>
   ${homeInd(true)}`;
  bind(el,'[data-act="back"]',()=>quitDialog('fast review', ()=>back()));
  bind(el,'[data-act="right"]',()=>moreSheet());
  const card=el.querySelector('[data-card]'); const yes=el.querySelector('[data-yes]'), no=el.querySelector('[data-no]');
  let flipped=false, sx=0, dx=0, drag=false, moved=false;
  const flip=()=>{ flipped=!flipped; card.classList.toggle('flipped',flipped); };
  const fling=(known)=>{ F.known+=known?1:0; card.style.transition='transform .4s ease-in, opacity .4s'; card.style.transform=`translateX(${known?480:-480}px) rotate(${known?24:-24}deg)${flipped?' rotateY(180deg)':''}`; card.style.opacity=0; setTimeout(()=>{ F.i++; rerender(); const nc=stack[stack.length-1].el.querySelector('[data-card]'); if(nc){ nc.animate([{transform:'scale(.92) translateY(24px)',opacity:.4},{transform:'none',opacity:1}],{duration:320,easing:'cubic-bezier(.22,.8,.24,1)'});} }, 340); };
  card.addEventListener('pointerdown',e=>{ drag=true; moved=false; sx=e.clientX; dx=0; card.style.transition='none'; card.setPointerCapture(e.pointerId); });
  card.addEventListener('pointermove',e=>{ if(!drag) return; dx=e.clientX-sx; if(Math.abs(dx)>6) moved=true; card.style.transform=`translateX(${dx}px) rotate(${dx/18}deg)${flipped?' rotateY(180deg)':''}`; yes.style.opacity=Math.max(0,Math.min(1,dx/90)); no.style.opacity=Math.max(0,Math.min(1,-dx/90)); });
  card.addEventListener('pointerup',()=>{ if(!drag) return; drag=false; card.style.transition=''; if(dx>90) return fling(true); if(dx<-90) return fling(false); card.style.transform=''; yes.style.opacity=0; no.style.opacity=0; if(!moved) flip(); });
  card.addEventListener('keydown',e=>{ if(e.key===' '||e.key==='Enter'){e.preventDefault();flip();} if(e.key==='ArrowRight') fling(true); if(e.key==='ArrowLeft') fling(false); });
  bind(el,'[data-yes-b]',()=>{ yes.style.opacity=1; fling(true); });
  bind(el,'[data-no-b]',()=>{ no.style.opacity=1; fling(false); });
};

/* quiz */
function newQuiz(title){ S.quiz={title, i:0, ans:QUIZ.map(()=>({sel:null, sub:false})), streak:0}; }
R.quiz = (el) => {
  const Q=S.quiz, q=QUIZ[Q.i], a=Q.ans[Q.i];
  const pillCls = k => { const x=Q.ans[k]; if(k===Q.i) return 'cur'; if(x.sub) return x.sel===QUIZ[k].a?'ok':'bad'; return ''; };
  const optCls = k => { if(!a.sub) return a.sel===k?'sel':''; if(k===q.a) return 'right'; if(k===a.sel) return 'wrong'; return 'dim'; };
  const okNow = a.sub && a.sel===q.a;
  const isLast = Q.i===QUIZ.length-1;
  el.innerHTML = `${statusBar()}${navBar({title:Q.title, left:'x', right:'dots-three', onPurple:true})}
   <div class="qcard ${S.textBig?'big':''}">
     <div class="qpills" data-pills>${QUIZ.map((_,k)=>`<button class="qp ${pillCls(k)}" data-q="${k}">${k+1}</button>`).join('')}</div>
     <div class="qmeta"><button class="icbtn" data-aa aria-label="Text size" style="width:28px;height:28px;color:${S.textBig?'var(--primary)':'var(--on2)'}">${ic('r-text-aa','s20')}</button>
       <span class="bolts">${[0,1,2].map(k=>ic(k<Math.min(3,Q.streak)?'f-lightning':'r-lightning','s20',k<Math.min(3,Q.streak)?'#F5B700':'#A2A2A2')).join('')}</span>
       <span class="b14 mut">${Q.i+1} of ${QUIZ.length}</span></div>
     <div class="qbody" data-body>
       <p class="qtext">${esc(q.q)}</p>
       <div class="opts ${q.type==='tf'?'tf':''}">${q.o.map((o,k)=>`<button class="opt ${optCls(k)}" data-o="${k}" ${a.sub?'disabled':''}>${esc(o)}</button>`).join('')}</div>
       ${a.sub?`<div class="details"><div class="l12">Answer Details</div><p class="b14 mut" style="margin:8px 0 0">${esc(q.d)}</p></div>`:''}
     </div>
     ${a.sub?`<div class="verdict ${okNow?'ok':'bad'}">${ic(okNow?'r-check':'r-x','s20')}${okNow?'Great job!':'Keep practicing!'}</div>`:`<div class="qfoot b14">${a.sel===null?'Choose Answer':'Tap Submit to check'}</div>`}
   </div>
   <div class="qbar"><button class="btn white sq" data-hint aria-label="Hint">${ic('r-pencil-simple-line','s20')}</button>
     ${!a.sub?`<button class="btn ${a.sel===null?'disabled':'white'}" data-submit>Submit</button>`:`<button class="btn white" data-next>${isLast?'Finish':'Next'}</button>`}</div>
   ${homeInd(true)}`;
  // keep the current pill in view
  const pills=el.querySelector('[data-pills]'); requestAnimationFrame(()=>{ const cur=pills.querySelector('.cur'); if(cur) pills.scrollLeft=cur.offsetLeft-150; });
  bind(el,'[data-act="back"]',()=>quitDialog('exercise', ()=>back()));
  bind(el,'[data-act="right"]',()=>moreSheet());
  bind(el,'[data-aa]',()=>{ S.textBig=!S.textBig; rerender(); });
  bind(el,'[data-o]',(b)=>{ a.sel=+b.dataset.o; rerender(); });
  bind(el,'[data-q]',(b)=>{ Q.i=+b.dataset.q; swapQ(); });
  bind(el,'[data-submit]',()=>{ a.sub=true; Q.streak = a.sel===q.a ? Q.streak+1 : 0; rerender(); if(a.sel===q.a) burst(el); });
  bind(el,'[data-next]',()=>{ if(isLast||Q.ans.every(x=>x.sub)){ go('result',{},'fade'); return; } const nx=Q.ans.findIndex((x,k)=>k>Q.i&&!x.sub); Q.i = nx>-1?nx:Q.ans.findIndex(x=>!x.sub); swapQ(); });
  bind(el,'[data-hint]',()=>{ if(a.sub) return toast('Already answered'); const wrong=q.o.map((_,k)=>k).filter(k=>k!==q.a); const kill=wrong[0]; const btn=el.querySelector(`[data-o="${kill}"]`); btn.classList.add('dim'); btn.disabled=true; toast('One wrong answer removed'); });
};
function swapQ(){ rerender(); const b=stack[stack.length-1].el.querySelector('[data-body]'); b.animate([{opacity:0,transform:'translateX(24px)'},{opacity:1,transform:'none'}],{duration:300,easing:'cubic-bezier(.22,.8,.24,1)'}); }
function burst(el){ const v=el.querySelector('.verdict'); if(!v) return; v.animate([{transform:'scale(.9)'},{transform:'scale(1.04)'},{transform:'scale(1)'}],{duration:380}); }

R.result = (el) => {
  const Q=S.quiz; const ok=Q.ans.filter((x,k)=>x.sub&&x.sel===QUIZ[k].a).length, bad=Q.ans.filter((x,k)=>x.sub&&x.sel!==QUIZ[k].a).length, un=QUIZ.length-ok-bad;
  const pct=Math.round(ok/QUIZ.length*100); S.lastResult={ok};
  const C=2*Math.PI*78;
  el.innerHTML = `${statusBar()}${navBar({title:Q.title, left:'x', right:'dots-three', onPurple:true})}
   <div class="qcard" style="margin-bottom:16px;padding:24px;overflow-y:auto">

/* ---------------- jump menu ---------------- */
function jump(where){
  closeOverlay(true);
  const reset=(arr)=>{ $app.innerHTML=''; stack=arr.map(([n,p])=>({name:n,params:p||{},el:null})); const top=stack[stack.length-1]; top.el=render(top.name,top.params); top.el.classList.add('anim-fade-in'); $app.appendChild(top.el); };
  S.ddOpen=false;
  switch(where){
    case 'splash': reset([['splash']]); break;
    case 'onboarding': reset([['onboarding']]); break;
    case 'signup': reset([['signup']]); break;
    case 'setup': S.phone=S.phone||'9123-4567'; reset([['users']]); break;
    case 'code': S.phone=S.phone||'9123-4567'; reset([['signup'],['phone'],['code',{phone:S.phone}]]); break;
    case 'signin': reset([['signin']]); break;
    case 'home': S.tab='syllabus'; reset([['home']]); break;
    case 'topics': S.tab='syllabus'; useBook(BOOKS[0]); S.unit='Numbers'; S.topicOpen=2; reset([['home'],['units'],['topics']]); break;
    case 'flash': useBook(BOOKS[0]); S.topic='Adding more Numbers'; S.flash={i:0,known:0,title:LESSONS[0]}; reset([['home'],['units'],['topics'],['fastreview'],['flash']]); break;
    case 'quiz': useBook(BOOKS[0]); S.topic='Adding more Numbers'; newQuiz(LESSONS[0]); reset([['home'],['units'],['topics'],['exercises'],['quiz']]); break;
    case 'friends': S.tab='syllabus'; reset([['home'],['friends']]); break;
    case 'profile': S.tab='syllabus'; reset([['home'],['friends'],['profile',{id:'alex'}]]); break;
    case 'bookmarks': S.tab='bookmarks'; reset([['bookmarks']]); break;
  }
}
document.querySelectorAll('[data-jump]').forEach(b=>b.addEventListener('click',()=>jump(b.dataset.jump)));
window.__muthabr = {jump, go, back, S};
// allow #hash deep links for sharing a flow
const start = (location.hash||'').slice(1);
jump(['onboarding','signup','code','setup','profile','signin','home','topics','flash','quiz','friends','bookmarks'].includes(start)?start:'splash');

const dev=document.getElementById('device');
function fit(){ if(innerWidth<=480){dev.style.transform='';return;} const s=Math.min(1,(innerHeight-48)/836); dev.style.transform=`scale(${s})`; dev.style.margin=`${(812*s-812)/2}px ${(375*s-375)/2}px`; }
addEventListener('resize',fit); fit();
})();
